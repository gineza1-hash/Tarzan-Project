services:
  - type: web
    name: tarzan-sacco-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_NAME
        value: Tarzan SACCO Ledger
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_SENDER_ID
        sync: false
      - key: AT_USSD_CODE
        sync: false
